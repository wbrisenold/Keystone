name: Validate and Release DCTL

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate DCTL
        run: python3 ci/validate_dctl.py
      - name: Build release package
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euxo pipefail
          mkdir -p dist/package
          cp -R dctl README.md SYSTEM.md VALIDATION.md LICENSE dist/package/
          (cd dist/package && sha256sum dctl/*.dctl > SHA256SUMS.txt)
          (cd dist/package && zip -r ../${{ github.event.repository.name }}-${{ github.ref_name }}.zip .)
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ github.event.repository.name }}-${{ github.ref_name }}.zip
